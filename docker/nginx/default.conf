# Auth-System – nginx-Vhost im Container. TLS wird NICHT hier terminiert;
# davor gehört ein Reverse Proxy (Traefik, nginx-proxy-manager, Caddy, …)
# mit gültigem Zertifikat. Er muss X-Forwarded-Proto/Host/For setzen und
# in der App über TRUSTED_PROXIES freigegeben werden.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Grosszuegig, damit auch das Einspielen einer Datensicherung durchpasst.
    client_max_body_size 512m;

    # Sicherheits-Header (der Reverse Proxy darf sie überschreiben/ergänzen)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Versteckte Dateien blocken (aber /.well-known/ für OIDC durchlassen)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
