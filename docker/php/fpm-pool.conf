; Ergänzt/überschreibt den Standard-[www]-Pool des offiziellen php:fpm-Images
; (dieser lauscht bereits auf 127.0.0.1:9000 und läuft als www-data).
[www]

; WICHTIG: Container-Umgebungsvariablen (docker compose "environment:")
; an PHP durchreichen – sonst greift z.B. DB_HOST=db nicht.
clear_env = no

; Worker-Ausgabe in den Container-Log-Stream
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
