; Auth-System PHP-Laufzeiteinstellungen (Container)
memory_limit = 512M
max_execution_time = 300

; Uploads: Logo, Favicon, Login-Hintergrund und vor allem das Einspielen einer
; Datensicherung. Muss <= nginx client_max_body_size sein.
upload_max_filesize = 512M
post_max_size = 520M
max_file_uploads = 20

expose_php = Off
date.timezone = UTC

; OPcache: der Code ist fest ins Image gebacken -> Zeitstempelprüfung aus.
; ACHTUNG: Wer den Quellcode zum Entwickeln als Bind-Mount einhängt, muss
; opcache.validate_timestamps auf 1 stellen (siehe docs/DEPLOYMENT.md).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Fehler in den Container-Log-Stream (stderr), nicht in eine Datei
log_errors = On
error_log = /dev/stderr
display_errors = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
