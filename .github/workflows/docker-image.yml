name: Docker Image

# Baut das Container-Image und veröffentlicht es in der GitHub Container
# Registry (ghcr.io). Ergebnis-Image:  ghcr.io/<owner>/<repo>
#
#   Release-Tag v1.2.3  -> :1.2.3  und :1.2  und :latest
#   Commit auf main      -> :dev    und :sha-<kurz>
#   Commit auf Branch X  -> :X      und :sha-<kurz>
#
# "latest" entsteht also NUR bei einem Versions-Tag, "dev" bei jedem
# Commit auf dem Default-Branch. Für Pull Requests wird nur gebaut (kein Push).

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
      - 'composer.*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Standard: GitHub Container Registry. Für einen anderen Forge/Registry
# (z.B. Gitea) einfach Repo-Variablen setzen: REGISTRY, IMAGE_NAME,
# REGISTRY_USER und das Secret REGISTRY_TOKEN. Siehe docs/DEPLOYMENT.md.
env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tags/Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Release-Tag vX.Y.Z  ->  1.2.3 / 1.2 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # Commit auf dem Default-Branch  ->  dev
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            # Jeder Branch-Commit  ->  Branchname + sha-<kurz>
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Bauen & pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
